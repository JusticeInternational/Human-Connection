version: "3.8"

services:
  backend:
    image: humanconnection/nitro-backend:lightsail-test
    build:
      context: ../../backend
      target: production
      args:
        - BUILD_COMMIT=lightsail-test
    restart: unless-stopped
    depends_on:
      - neo4j
    networks:
      - hc-test
      - vikunja
    volumes:
      - uploads:/nitro-backend/public/uploads
    environment:
      NODE_ENV: production
      PORT: "4000"
      VIRTUAL_HOST: sol.humantics.ai
      VIRTUAL_PORT: "4000"
      LETSENCRYPT_HOST: sol.humantics.ai
      LETSENCRYPT_EMAIL: tech@corechs.com
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in deployment/lightsail-test/.env}
      GRAPHQL_URI: ${GRAPHQL_URI:?Set GRAPHQL_URI in deployment/lightsail-test/.env}
      CLIENT_URI: ${CLIENT_URI:?Set CLIENT_URI in deployment/lightsail-test/.env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deployment/lightsail-test/.env}
      PRIVATE_KEY_PASSPHRASE: ${PRIVATE_KEY_PASSPHRASE:?Set PRIVATE_KEY_PASSPHRASE in deployment/lightsail-test/.env}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-disabled-for-backend-test}
      PUBLIC_REGISTRATION: "false"
    mem_limit: 1g
    cpus: 0.5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  neo4j:
    image: humanconnection/neo4j:latest
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - hc-test
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in deployment/lightsail-test/.env}
      NEO4J_dbms_security_procedures_unrestricted: algo.*,apoc.*
      NEO4J_dbms_memory_heap_initial__size: 256M
      NEO4J_dbms_memory_heap_max__size: 512M
      NEO4J_dbms_memory_pagecache_size: 256M
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j_data:/data
    mem_limit: 1g
    cpus: 0.5
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hc-test:
    driver: bridge
  vikunja:
    external:
      name: vikunja_default

volumes:
  neo4j_data:
  uploads:
