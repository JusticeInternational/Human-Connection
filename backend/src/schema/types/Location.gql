enum _LoactionOrdering {
    id_asc
    id_desc
    name_asc
    name_desc
}

type Location {
  id: ID!
  name: String!
  nameEN: String
  nameDE: String
  nameFR: String
  nameNL: String
  nameIT: String
  nameES: String
  namePT: String
  namePL: String
  nameRU: String
  type: String!
  lat: Float
  lng: Float
  parent: Location @cypher(statement: "MATCH (this)-[:IS_IN]->(l:Location) RETURN l")
}

type Query {
    Location(
        id: ID
        name: String
        orderBy: [_LoactionOrdering]
    ): [Location]
}

